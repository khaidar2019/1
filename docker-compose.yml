services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bulk_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: ./apps/backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bulk_saas
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret
      FRONTEND_URL: http://localhost
    depends_on:
      - postgres
      - redis
    volumes:
      - ./sessions:/sessions
    ports:
      - '4000:4000'

  worker:
    build: ./apps/worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bulk_saas
      REDIS_URL: redis://redis:6379
      MIN_DELAY_MS: 10000
      MAX_DELAY_MS: 30000
      HEADLESS: 'true'
    depends_on:
      - postgres
      - redis
    volumes:
      - ./sessions:/sessions

  frontend:
    build: ./apps/frontend
    environment:
      VITE_API_URL: http://localhost/api
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
